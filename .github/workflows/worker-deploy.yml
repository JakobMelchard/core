name: worker-deploy
on:
  workflow_call:
    inputs:
      environment:
        type: string
        default: production
      install-cmd:
        type: string
        default: npm install
      node-version:
        type: string
        default: "22"
    secrets:
      cloudflare-api-token:
        description: Cloudflare API token with Workers:Edit permission.
        required: true
      cloudflare-account-id:
        description: Cloudflare account ID (optional; wrangler reads from wrangler.jsonc if omitted).
        required: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '${{ inputs.node-version }}' }
      - run: ${{ inputs.install-cmd }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.cloudflare-account-id }}

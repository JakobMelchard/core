name: js-check
on:
  workflow_call:
    inputs:
      node-version: { type: string, default: '22' }
      e2e: { type: boolean, default: true }
      core-ref: { type: string, default: '', description: 'override @jakobmelchard/core with this core git ref (consumers-e2e)' }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JakobMelchard/core/.github/actions/setup-js@v0
        with: { node-version: '${{ inputs.node-version }}', browsers: '${{ inputs.e2e }}' }
      - if: inputs.core-ref != ''
        run: npm i --no-save "github:JakobMelchard/core#${{ inputs.core-ref }}"
      - run: npx tsc
      - run: npm test
      - if: inputs.e2e
        run: npm run e2e

name: setup-js
description: Node + npm ci + Playwright Chromium (cached)
inputs:
  node-version: { default: '22' }
  browsers: { default: 'false', description: install chromium for e2e }
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with: { node-version: '${{ inputs.node-version }}' }
    - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      shell: bash
    - if: inputs.browsers == 'true'
      uses: actions/cache@v4
      with: { path: ~/.cache/ms-playwright, key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }} }
    - if: inputs.browsers == 'true'
      run: npx playwright-core install --with-deps chromium
      shell: bash
